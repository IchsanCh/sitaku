services:
    exavro:
        build:
            context: .
            dockerfile: Dockerfile
        image: exavro-app:latest
        container_name: exavro-app
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - CONTAINER_ROLE=app
        expose:
            - "9000"
        networks:
            - nginx-proxy
        restart: unless-stopped
        mem_limit: 2g

    queue:
        image: exavro-app:latest
        container_name: exavro-queue
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - CONTAINER_ROLE=queue
        command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
        depends_on:
            - exavro
        networks:
            - nginx-proxy
        restart: unless-stopped
        mem_limit: 1g

    reverb:
        image: exavro-app:latest
        container_name: exavro-reverb
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - CONTAINER_ROLE=reverb
            - VIRTUAL_HOST=exavro-reverb.lotusaja.com
            - VIRTUAL_PORT=8080
            - LETSENCRYPT_HOST=exavro-reverb.lotusaja.com
            - LETSENCRYPT_EMAIL=info.lotusaja@gmail.com
        command:
            ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        depends_on:
            - exavro
        expose:
            - "8080"
        networks:
            - nginx-proxy
        restart: unless-stopped
        mem_limit: 1g

    webexavro:
        image: nginx:alpine
        container_name: exavro-nginx
        depends_on:
            - exavro
        volumes:
            - ./:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        environment:
            - VIRTUAL_HOST=exavro.lotusaja.com
            - LETSENCRYPT_HOST=exavro.lotusaja.com
            - LETSENCRYPT_EMAIL=info.lotusaja@gmail.com
        expose:
            - "80"
        networks:
            - nginx-proxy
        restart: unless-stopped
        mem_limit: 1g

networks:
    nginx-proxy:
        external: true
