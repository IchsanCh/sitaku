opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; validate_timestamps=1 + revalidate_freq=2 -> otomatis pickup perubahan file
; tanpa perlu restart container tiap deploy. Kalau mau performa maksimal dan
; oke restart container tiap deploy, ganti validate_timestamps ke 0.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1